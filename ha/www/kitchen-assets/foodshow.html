<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen screensaver</title>
<!--
  Fully Kiosk's screensaver renders this page as its wallpaper.

  Why a page rather than Fully's own screensaverPlaylist: the playlist
  reported "playlist is empty" with 30 perfectly good URLs in it, and a page
  gives control over timing and the crossfade besides.

  The image list is NOT baked in. It is fetched from food.json beside this
  file, so refreshing the pictures means rewriting one small JSON file and
  never touching this page or Fully's settings.
-->
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  img { position:absolute; inset:0; width:100%; height:100%;
        object-fit:cover; opacity:0; transition:opacity 1.6s ease-in-out; }
  img.on { opacity:1; }
</style>
<img id="a"><img id="b">
<script>
  // Four minutes a picture. Long enough that a glance across the kitchen is
  // not a slideshow demanding attention, short enough that the whole set of
  // thirty still comes round in a couple of hours.
  const HOLD = 240000;
  const slots = [document.getElementById("a"), document.getElementById("b")];
  let pics = [], i = 0, slot = 0;

  const shuffle = (xs) => {
    for (let n = xs.length - 1; n > 0; n -= 1) {
      const m = Math.floor(Math.random() * (n + 1));
      [xs[n], xs[m]] = [xs[m], xs[n]];
    }
    return xs;
  };

  // Two <img> elements alternate so one can fade in over the other. Loading
  // into the hidden one first means a slow image never shows as a black gap.
  function next() {
    if (!pics.length) return;
    const img = slots[slot];
    const other = slots[1 - slot];
    img.onload = () => {
      img.classList.add("on");
      other.classList.remove("on");
      slot = 1 - slot;
    };
    img.onerror = () => {};          // a missing picture just waits its turn
    img.src = pics[i % pics.length];
    i += 1;
  }

  async function start() {
    try {
      const r = await fetch("food.json", { cache: "no-store" });
      pics = shuffle(await r.json());
    } catch (err) {
      pics = [];
    }
    next();
    setInterval(next, HOLD);
    // Re-read the list every half hour, so new recipes appear on their own
    // without anyone regenerating anything.
    setInterval(async () => {
      try {
        const r = await fetch("food.json", { cache: "no-store" });
        const fresh = await r.json();
        if (Array.isArray(fresh) && fresh.length) pics = shuffle(fresh);
      } catch (err) { /* keep what we have */ }
    }, 1800000);
  }
  start();
</script>
